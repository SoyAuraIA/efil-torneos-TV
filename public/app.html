<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torneos EFIL</title>
<script src="config.js"></script>
<style>
@font-face { font-family: "Barlow"; font-weight: 400; src: url("fonts/Barlow-Regular.ttf") format("truetype"); }
@font-face { font-family: "Barlow"; font-weight: 500; src: url("fonts/Barlow-Medium.ttf") format("truetype"); }
@font-face { font-family: "Barlow"; font-weight: 600; src: url("fonts/Barlow-SemiBold.ttf") format("truetype"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("fonts/BarlowCondensed-Bold.ttf") format("truetype"); }
</style>
<style>
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #11263f; --muted: #5d6e82; --line: #d6dde6;
  --brand: #2a0a1e; --brand-ink: #ffffff; --accent: #1aa7f5; --accent-ink: #06121b;
  --good: #1f7a4d; --bad: #b3372c;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1a2b; --surface: #132a45; --ink: #eef3f8; --muted: #93a6bc; --line: #26405f;
    --brand: #5b2b4c; --brand-ink: #ffffff;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1a2b; --surface: #132a45; --ink: #eef3f8; --muted: #93a6bc; --line: #26405f;
  --brand: #5b2b4c; --brand-ink: #ffffff;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
body { min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- inicio ---------- */
.home { max-width: 560px; margin: 0 auto; padding: 32px 20px; }
.home h1 { font-family: var(--display); font-size: 40px; line-height: 1.05; margin: 12px 0 6px; }
.home p { color: var(--muted); margin: 0 0 24px; line-height: 1.45; }
.big-link { display: block; text-decoration: none; padding: 20px; margin-bottom: 12px; border-radius: 14px;
  background: var(--brand); color: var(--brand-ink); font-family: var(--display); font-size: 26px; font-weight: 700; }
.big-link small { display: block; font-family: var(--body); font-weight: 400; font-size: 15px; opacity: .85; margin-top: 4px; }
.big-link.alt { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.shield { display: block; height: 92px; width: auto; }

/* ---------- admin ---------- */
.admin { max-width: 640px; margin: 0 auto; padding: 14px 14px 80px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.top a { color: var(--muted); text-decoration: none; font-size: 15px; }
.top h1 { font-family: var(--display); font-size: 26px; margin: 0; }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
.seg button { flex: 0 0 auto; padding: 10px 14px; border-radius: 999px; border: 2px solid var(--line);
  background: var(--surface); font-weight: 600; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0 14px; }
.tabs button { padding: 12px 6px; border: 0; border-bottom: 4px solid var(--line); background: transparent; font-weight: 600; min-height: 44px; }
.tabs button[aria-pressed="true"] { border-bottom-color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.card h2 { font-family: var(--display); font-size: 22px; margin: 0 0 10px; }
.row { display: grid; gap: 8px; margin-bottom: 10px; }
.row.two { grid-template-columns: 1fr 1fr; }
label.f { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
input, select { background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 46px; width: 100%; color: var(--ink); }
.btn { border: 0; border-radius: 10px; padding: 12px 16px; min-height: 46px; font-weight: 600; background: var(--brand); color: var(--brand-ink); }
.btn.sec { background: transparent; border: 2px solid var(--line); color: var(--ink); }
.btn.warn { background: var(--bad); color: #fff; }
.btn.go { background: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 40px; padding: 8px 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.match .who { display: grid; grid-template-columns: 1fr 58px 18px 58px 1fr; gap: 6px; align-items: center; margin: 8px 0; }
.match .who .t { font-weight: 600; line-height: 1.15; }
.match .who .t.r { text-align: right; }
.match .who input { text-align: center; padding: 8px 4px; font-size: 20px; font-weight: 700; }
.match .meta { color: var(--muted); font-size: 14px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--line); margin-right: 6px; }
.badge.done { background: var(--good); color: #fff; }
.empty { color: var(--muted); text-align: center; padding: 18px 8px; }
textarea { width: 100%; min-height: 140px; background: var(--bg); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.note { color: var(--muted); font-size: 14px; line-height: 1.4; margin: 0 0 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 20; }

/* ---------- pantalla de TV ---------- */
.tv { --bg: #160812; --surface: #26101f; --ink: #f7f4f6; --muted: #bba9b6; --line: #43253a; --accent: #1aa7f5; --accent-ink: #06121b;
  position: fixed; inset: 0; background: var(--bg); color: var(--ink); overflow: hidden;
  font-size: clamp(13px, 1.55vw, 36px); display: flex; flex-direction: column;
  padding: 2.2em 3em 1.4em; cursor: none; }
.tv-head { display: flex; align-items: center; gap: 1.1em; margin-bottom: 1.2em; }
.tv-shield { height: 4.6em; width: auto; flex: none; display: block; }
.tv-title { font-family: var(--display); font-weight: 700; font-size: 2.6em; line-height: 1; }
.tv-screen { margin-left: auto; display: flex; align-items: center; font-family: var(--display); font-weight: 600; font-size: 2em; color: var(--accent); }
.tv-screen.oro { color: #f6c744; }
.tv-screen.plata { color: #d5dbe3; }
.trophy { height: 1.7em; width: 1.7em; margin-right: .35em; flex: none; }
.trophy.small { height: .95em; width: .95em; margin-right: .3em; vertical-align: -.12em; }
.tv-body { flex: 1; min-height: 0; border-top: 0.18em solid var(--accent); padding-top: 1.1em; display: grid; gap: 1.6em; align-content: start; }
.tv-body.cols2 { grid-template-columns: 1fr 1fr; }
.tv-body.cols3 { grid-template-columns: repeat(3, 1fr); }
.grp h3 { font-family: var(--display); font-size: 1.7em; margin: 0 0 .4em; color: var(--muted); font-weight: 600; }
table.pos { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.pos th { text-align: right; font-weight: 500; color: var(--muted); padding: .35em .5em; font-size: .85em; }
table.pos th:nth-child(2), table.pos td:nth-child(2) { text-align: left; }
table.pos td { padding: .5em .5em; text-align: right; border-top: 1px solid var(--line); font-size: 1.15em; }
table.pos td.n { color: var(--muted); width: 1.6em; }
table.pos td.name { font-weight: 600; font-size: 1.3em; }
table.pos td.pts { font-family: var(--display); font-size: 1.8em; font-weight: 700; color: var(--accent); }
table.pos tr.lead td.name { color: var(--accent); }
.list { display: grid; gap: .55em; }
.mrow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .9em; background: var(--surface); border-radius: .5em; padding: .45em 1em; }
.mrow .tm { font-weight: 600; font-size: 1.35em; }
.mrow .tm.r { text-align: right; }
.board { display: inline-flex; gap: .25em; align-items: center; font-family: var(--display); font-weight: 700; font-size: 1.7em; }
.board span { background: #08020a; color: var(--accent); min-width: 1.5em; text-align: center; padding: 0 .25em; border-radius: .2em; }
.board i { color: var(--muted); font-style: normal; font-size: .7em; }
.when { text-align: center; line-height: 1.1; }
.when b { font-family: var(--display); font-size: 1.6em; color: var(--accent); display: block; }
.when small { color: var(--muted); font-size: .95em; }
table.pos tr.q td:first-child { box-shadow: inset .3em 0 0 var(--accent); }
table.pos tr.q td.n { color: var(--accent); }
table.pos .zn { color: var(--muted); font-size: .7em; font-weight: 500; margin-left: .6em; }
.compact table.pos th:nth-child(4), .compact table.pos th:nth-child(5), .compact table.pos th:nth-child(6),
.compact table.pos td:nth-child(4), .compact table.pos td:nth-child(5), .compact table.pos td:nth-child(6) { display: none; }
.compact table.pos td { padding: .4em .35em; }
.compact table.pos td.name { font-size: 1.15em; }
.compact table.pos td.pts { font-size: 1.6em; }
.row.three { grid-template-columns: 1.3fr 1fr 1fr; }
.grp h3.ph { color: var(--ink); font-size: 2em; margin: 0 0 .4em; }
.dense .mrow { padding: .3em .8em; gap: .6em; }
.dense .mrow .tm { font-size: 1.1em; }
.dense .list { gap: .3em; }
.dense .board { font-size: 1.35em; }
.dense .when { display: flex; align-items: baseline; gap: .5em; justify-content: center; white-space: nowrap; }
.dense .when b { display: inline; font-size: 1.25em; }
.dense .when small { font-size: .8em; }
.sub { grid-column: 1 / -1; color: var(--muted); font-size: 1.05em; margin: .5em 0 -.2em; }
.tv-foot { display: flex; align-items: center; gap: 1em; margin-top: 1em; color: var(--muted); font-size: .95em; }
.dots { display: flex; gap: .4em; margin-left: auto; }
.dots i { width: .6em; height: .6em; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.is-tv .toast { font-size: 2vw; padding: .5em 1.2em; }
.bar { position: absolute; left: 0; bottom: 0; height: .4em; background: var(--accent); width: 100%; transform-origin: left; animation: fill var(--dur, 12s) linear forwards; }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.tv-empty { margin: auto; font-family: var(--display); font-size: 2.4em; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { .bar { animation: none; transform: scaleX(0); } }
</style>
</head>

function uid() { return Math.random().toString(36).slice(2, 9); }
function seed() {
  function mk(name, groups) {
    var t = { id: uid(), name: name, teams: [], matches: [] };
    if (window.EFIL_API) groups = [];
    groups.forEach(function (g) {
      var ids = g.teams.map(function (n) { var o = { id: uid(), name: n, group: g.name }; t.teams.push(o); return o.id; });
      for (var i = 0; i < ids.length; i++) for (var j = i + 1; j < ids.length; j++) {
        t.matches.push({ id: uid(), phase: "Zona", group: g.name, home: ids[i], away: ids[j], hg: null, ag: null, date: "2026-12-05", time: "09:00", field: "Cancha 1" });
      }
    });
    t.matches.forEach(function (m, k) {
      var mins = 9 * 60 + (k % 8) * 50;
      m.time = pad(Math.floor(mins / 60)) + ":" + pad(mins % 60);
      m.date = k < 8 ? "2026-12-05" : "2026-12-06";
      if (k < 5) { m.hg = (k * 2 + 1) % 4; m.ag = (k + 1) % 3; }
    });
    return t;
  }
  return {
    updatedAt: Date.now(), rotation: 12,
    tournaments: [
      mk("Torneo Nacional de EFIL 2026", [
        { name: "A", teams: ["Equipo Uno", "Equipo Dos", "Equipo Tres", "Equipo Cuatro"] },

}
function load() {

}

function pull() {
  if (!API) return Promise.resolve(false);
  return fetch(API, { cache: "no-store", signal: withTimeout(8000) })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (remote) {

}

    var made = 0;
    groupsOf(t).forEach(function (g) {
      var zt = t.teams.filter(function (x) { return (x.group || "") === g; });
      for (var i = 0; i < zt.length; i++) for (var j = i + 1; j < zt.length; j++) {
        var ta2 = zt[i].id, tb2 = zt[j].id;
        var ex = t.matches.some(function (m) { return m.phase === "Zona" && ((m.home === ta2 && m.away === tb2) || (m.home === tb2 && m.away === ta2)); });
        if (!ex) { t.matches.push({ id: uid(), phase: "Zona", group: g, home: ta2, away: tb2, hg: null, ag: null, date: "", time: "", field: "" }); made++; }
      }
    });
    if (!made) return toast("No hay partidos nuevos para crear");
    ui.tab = "partidos"; save(); toast(made + " partidos creados"); return renderAdmin();
  }
  if (act === "mkBracket") {
    var fmt = val("k-fmt"), L = [];
    function K(ph, a, b) { L.push([ph, a, b]); }
    if (fmt === "fem") {
      K("Semifinal", "1° Zona A", "2° Zona B"); K("Semifinal", "1° Zona B", "2° Zona A"); K("Final", "Ganador Semifinal 1", "Ganador Semifinal 2");
    } else {
      for (var o = 1; o <= 8; o++) K("Octavos", "Por definir", "Por definir");
      for (var c = 1; c <= 4; c++) K("Cuartos", "Ganador Octavos " + (2 * c - 1), "Ganador Octavos " + (2 * c));
      K("Semifinal Oro", "Ganador Cuartos 1", "Ganador Cuartos 2"); K("Semifinal Oro", "Ganador Cuartos 3", "Ganador Cuartos 4");
      K("Final Oro", "Ganador Semi Oro 1", "Ganador Semi Oro 2");
      K("Semifinal Plata", "Perdedor Cuartos 1", "Perdedor Cuartos 2"); K("Semifinal Plata", "Perdedor Cuartos 3", "Perdedor Cuartos 4");
      K("Final Plata", "Ganador Semi Plata 1", "Ganador Semi Plata 2");
    }
    var used = {}; L.forEach(function (r) { used[r[0]] = 1; });
    if (t.matches.some(function (m) { return used[m.phase]; })) return toast("Ya hay cruces de esas fases");
    L.forEach(function (r) { t.matches.push({ id: uid(), phase: r[0], group: "", home: "~" + r[1], away: "~" + r[2], hg: null, ag: null, date: "", time: "", field: "" }); });
    save(); toast(L.length + " cruces creados"); return renderAdmin();
  }
  if (act === "rot") { state.rotation = Math.max(5, parseInt(val("d-rot"), 10) || 12); save(); return toast("Guardado"); }
  if (act === "copy") {
    var ta = document.getElementById("d-json"); ta.select();
    try { document.execCommand("copy"); toast("Copiado"); } catch (e) { toast("Seleccioná y copiá a mano"); } return;
  }
  if (act === "import") {
    try { var o = JSON.parse(val("d-json")); if (!o.tournaments) throw 0; state = o; save(); ui.tid = null; toast("Datos cargados"); renderAdmin(); }
    catch (e) { toast("El texto no es válido"); } return;
  }
  if (act === "clear") { if (!arm("clear")) return; state.tournaments.forEach(function (x) { x.teams = []; x.matches = []; }); save(); toast("Torneos vacíos"); return renderAdmin(); }
  if (act === "demo") { if (!arm("demo")) return; state = seed(); save(); ui.tid = null; toast("Datos de ejemplo"); return renderAdmin(); }
});
document.addEventListener("keydown", function (e) {
  if (!API || (location.hash || "") !== "#tv") return;
  if (e.key === "Enter" || e.keyCode === 13 || e.keyCode === 23) {
    toast("Sincronizando...");
    pull().then(function (ok) { toast(ok ? "Datos actualizados" : "Sin conexión, se siguen mostrando los datos guardados"); if (ok) route(); });
  }
});
window.addEventListener("storage", function (e) { if (e.key === KEY && (location.hash || "") === "#tv") state = load(); });
route();
</script>
