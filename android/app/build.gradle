plugins {
    id 'com.android.application'
}

android {
    namespace 'ar.com.efil.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'ar.com.efil.tv'
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
