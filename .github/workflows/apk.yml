name: Compilar APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'public/app.html', 'public/fonts/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Copiar la app dentro del APK
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp public/app.html android/app/src/main/assets/app.html
          cp public/fonts/*.ttf android/app/src/main/assets/fonts/
      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk efil-tv.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: EFIL TV (APK)
          files: efil-tv.apk
